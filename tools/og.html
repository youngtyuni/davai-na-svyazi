<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>OG 1200×630</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;900&family=Inter+Tight:wght@500;700&display=swap">
  <style>
    /* Исходник для assets/og.png — рендерится скриптом tools/make-og.js */
    html, body { margin: 0; background: #0B0B0B; }
    .og {
      position: relative;
      width: 1200px;
      height: 630px;
      overflow: hidden;
      background: #0B0B0B;
      color: #F3F0E6;
      font-family: "Inter Tight", Inter, system-ui, sans-serif;
      box-sizing: border-box;
    }
    .frame { position: absolute; inset: 28px; border: 8px solid #D8FF3B; }
    .frame::after { content: ""; position: absolute; inset: 10px; border: 6px solid #FF3EA5; }
    .text { position: absolute; left: 84px; top: 120px; width: 620px; }
    h1 {
      margin: 0 0 22px;
      font-family: Unbounded, "Arial Black", sans-serif;
      font-weight: 900;
      font-size: 84px;
      line-height: .95;
      color: #D8FF3B;
      text-shadow: 6px 6px 0 #FF3EA5;
      letter-spacing: -.02em;
    }
    .sub {
      font-family: Unbounded, "Arial Black", sans-serif;
      font-weight: 700;
      font-size: 22px;
      text-transform: uppercase;
      letter-spacing: .04em;
      line-height: 1.3;
      margin-bottom: 26px;
    }
    .fine { font-size: 24px; color: #9a978f; }
    .badge-wrap { position: absolute; right: 100px; top: 70px; width: 380px; }
    .lanyard {
      width: 34px; height: 90px; margin: 0 auto;
      background: repeating-linear-gradient(180deg, #FF3EA5 0 14px, #3B5BFF 14px 28px);
      border: 3px solid #0B0B0B;
    }
    .badge {
      background: #F3F0E6; color: #0B0B0B;
      border: 6px solid #0B0B0B; border-radius: 14px;
      box-shadow: 10px 10px 0 #D8FF3B;
      transform: rotate(-4deg);
      text-align: center;
      padding: 0 24px 34px;
      margin-top: -6px;
    }
    .clip { width: 60px; height: 18px; margin: 0 auto; background: #333; border-radius: 0 0 8px 8px; }
    .hello {
      margin: 14px -24px 22px; padding: 12px;
      background: #FF3EA5; color: #F3F0E6;
      font-family: Unbounded, sans-serif; font-weight: 900; font-size: 22px; letter-spacing: .1em;
    }
    .name { font-family: Unbounded, sans-serif; font-weight: 900; font-size: 64px; line-height: 1; margin-bottom: 14px; }
    .title { font-size: 24px; color: #444; }
  </style>
</head>
<body>
  <div class="og">
    <div class="frame"></div>
    <div class="text">
      <h1>ДАВАЙ<br>НА СВЯЗИ</h1>
      <div class="sub">симулятор нетворкинга<br>в креативных индустриях</div>
      <div class="fine">3 минуты. Ни одного полезного контакта.</div>
    </div>
    <div class="badge-wrap">
      <div class="lanyard"></div>
      <div class="badge">
        <div class="clip"></div>
        <div class="hello">ПРИВЕТ, Я</div>
        <div class="name">никто</div>
        <div class="title">ex-всё, founder, в поиске себя</div>
      </div>
    </div>
  </div>
</body>
</html>
